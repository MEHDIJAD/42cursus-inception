<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inception</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Inception</h1>
  <p>Three containers, one Docker Compose stack, no ready-made images.</p>

  <div class="services">
    <div class="card">
      <span class="dot"></span>
      <h2>nginx</h2>
      <p>Sole entrypoint. HTTPS only, TLS 1.2/1.3.</p>
    </div>
    <div class="card">
      <span class="dot"></span>
      <h2>wordpress</h2>
      <p>php-fpm only. No built-in server, no nginx inside.</p>
    </div>
    <div class="card">
      <span class="dot"></span>
      <h2>mariadb</h2>
      <p>DB engine only. Two real users, no admin in the name.</p>
    </div>
  </div>

  <p class="note" id="note"></p>
  <script src="script.js"></script>
</body>
</html>
