server {
    listen 443 ssl;
    server_name ${DOMAIN_NAME};

    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass  wordpress:9000; 
		# ✅ This is the literal connection point between nginx and WordPress.
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		# $document_root = your root directive (/var/www/html) 
		# + 
		# $fastcgi_script_name = the request's script path (/wp-admin/index.php); 
		# ==> /var/www/html/wp-admin/index.php.
        include       fastcgi_params;
		# pulls in Nginx's standard set of FastCGI parameters 
    }
}